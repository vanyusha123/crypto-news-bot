name: Test message
on: workflow_dispatch
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          T=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          C=$(printf '%s' "$CHAT" | tr -d '[:space:]')
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${T}/sendMessage" --data-urlencode "chat_id=${C}" --data-urlencode "text=Тест: бот работает"
